name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  npm_config_registry: https://registry.npmjs.org/
  PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux webview prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: cargo fmt --all --check
      # herdstead-desktop needs its binary resource prepared by pnpm first;
      # the build job below covers it with the full desktop toolchain.
      - run: cargo clippy --workspace --all-targets --locked --exclude herdstead-desktop -- -D warnings
      - run: cargo test --workspace --locked --exclude herdstead-desktop
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  build:
    needs: check
    name: desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, bundles: 'app,dmg' }
          - { platform: macos-x64, os: macos-latest, target: x86_64-apple-darwin, bundles: 'app,dmg' }
          - { platform: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: 'appimage,deb' }
          - { platform: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, bundles: 'appimage,deb' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: crates/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: crates/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: pnpm install --frozen-lockfile
        working-directory: crates/desktop
      - name: Stamp desktop and bundled runtime version
        run: |
          scripts/set-version.sh "$RELEASE_TAG"
          cargo update --workspace
      - run: pnpm run prepare:runtime
        working-directory: crates/desktop
      - run: cargo build --workspace --locked
      - run: pnpm test
        working-directory: crates/desktop
      - name: Build native installers and signed updates
        working-directory: crates/desktop
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
          # Save the installer window layout instead of skipping Finder setup in CI.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          pnpm run build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Stage platform downloads
        run: python3 scripts/desktop-release.py stage ${{ matrix.platform }} target/${{ matrix.target }}/release/bundle release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify all installers and assemble updater manifest
        run: python3 scripts/desktop-release.py assemble release-assets "$RELEASE_TAG" "$GITHUB_REPOSITORY"
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Herdstead Desktop $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
