name: Release

# Builds and publishes the release binaries. `ci.yml` verifies pull requests;
# this workflow only ships a tag: a `v*` tag re-checks the tree, compiles the
# binary for each platform herdstead supports, and attaches
# `herdstead-<platform>.tar.gz` and its `.sha256` to the release the drafter
# created.
#
# The asset names carry the platform and no version, so the newest archive of
# each platform keeps one name: `releases/latest/download/herdstead-<platform>.tar.gz`
# is a permanent link to that platform's current build.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag normally points at a commit `ci.yml` already checked, but a tag can be
  # pushed straight to a branch, so the release re-runs the same gate before
  # anything is built.
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    name: build ${{ matrix.platform }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # herdstead is macOS and Linux only: the daemon and client talk over a
        # Unix socket, so there is no Windows archive. Linux ARM is built with
        # `cross` because the runners are x64.
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-arm64

          - target: x86_64-apple-darwin
            os: macos-latest
            platform: macos-x64

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-arm64
            use_cross: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # The tag is the version: `herdstead --version` reads it out of
      # `CARGO_PKG_VERSION`, so the workspace version is stamped before the
      # build and the lockfile is refreshed to match.
      - name: Set version from tag
        run: |
          ./scripts/set-version.sh "${GITHUB_REF_NAME}"
          cargo update --workspace
      - name: Install cross (Linux ARM)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          asset="herdstead-${{ matrix.platform }}.tar.gz"
          staged="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/herdstead" "${staged}/herdstead"
          tar -czf "${asset}" -C "${staged}" herdstead
          hash() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" > "$1.sha256"
            else
              shasum -a 256 "$1" > "$1.sha256"
            fi
          }
          hash "${asset}"
          cat "${asset}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.platform }}
          path: |
            herdstead-*.tar.gz
            herdstead-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          path: assets
          merge-multiple: true
      - name: Check every platform arrived
        shell: bash
        run: |
          set -euo pipefail
          # A build that uploaded nothing, or a download that dropped one,
          # must fail here rather than publish a release missing a platform.
          expected=4
          found="$(find assets -name 'herdstead-*.tar.gz' -type f | wc -l | tr -d ' ')"
          if [ "${found}" != "${expected}" ]; then
            echo "error: expected ${expected} archives, found ${found}" >&2
            find assets -type f >&2
            exit 1
          fi
      # The drafter publishes the release (and with it the tag), so normally
      # this only adds assets. `gh release create` keeps a tag pushed by hand
      # working too; `--clobber` makes a re-run of a failed upload harmless.
      - name: Create release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" \
                 --title "herdstead ${GITHUB_REF_NAME}" --generate-notes
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find assets -type f -exec gh release upload "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --clobber {} \;
